type: grid
cards:
  - type: tile
    entity: switch.water_garden_watering
    name: Start Watering
    features:
      - type: toggle
  - type: tile
    entity: switch.study_water_pump
    name: Pump
    features:
      - type: toggle
  - type: tile
    name: Phase
    entity: input_select.water_garden_phase
  - type: tile
    name: Segment timer
    entity: timer.water_garden_segment
  - type: markdown
    title: Pump
    content: >
      {% if is_state('switch.study_water_pump', 'on') %}

      <ha-alert alert-type="success">Pump RUNNING{% if
      states('input_select.water_garden_phase') in ['first_half',
      'second_half'] %} ({{ states('input_select.water_garden_phase')
      }}){% endif %}</ha-alert>

      {% else %}

      <ha-alert alert-type="error">Pump OFF{% if
      is_state('input_select.water_garden_phase', 'pause') %} (pause —
      butts rebalancing){% endif %}</ha-alert>

      {% endif %}
