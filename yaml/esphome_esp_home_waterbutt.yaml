esphome:
  name: esp-home-waterbutt

esp8266:
  board: d1_mini_pro

wifi:
  manual_ip:
    static_ip: 192.168.1.31
    gateway: 192.168.1.254
    subnet: 255.255.255.0

  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    password: "10bb29a71c769700e77f848d57beb00e"

sensor:
  - platform: ultrasonic
    trigger_pin:
      number: D1
      inverted: true
    echo_pin: D2
    name: "Ultrasonic Waterbutt"
    unit_of_measurement: "cm"
    update_interval: 30s
    timeout: 4m
    filters:
      - multiply: 100
      - round: 1
