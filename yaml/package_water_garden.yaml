# Water Garden package - split-run watering (50% / pause / 50%)
# Deployed to /config/packages/water_garden.yaml
# Source of truth fragments: repo yaml/ directory

input_boolean:
  water_butt_distance_fault:
    name: Distance sensor fault
    icon: mdi:radar

input_number:
  water_garden_duration_minutes:
    name: Water Garden Duration
    min: 1
    max: 180
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-outline
  water_garden_pause_minutes:
    name: Water Garden Pause
    min: 1
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-pause-outline
  water_garden_dripper_red_count:
    name: Red drippers (2 L/h)
    min: 0
    max: 200
    step: 1
    mode: box
    icon: mdi:water
  water_garden_dripper_black_count:
    name: Black drippers (4 L/h)
    min: 0
    max: 200
    step: 1
    mode: box
    icon: mdi:water
  water_garden_session_start_cm:
    name: Session start distance
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "cm"
    mode: box
    icon: mdi:ray-start-arrow
  water_garden_session_expected_litres:
    name: Last litres required (expected)
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "L"
    mode: box
    icon: mdi:cup-water
  water_butt_distance_stale_minutes:
    name: Distance sensor stale after
    min: 1
    max: 120
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-alert-outline

input_select:
  water_garden_phase:
    name: Water Garden Phase
    options:
      - idle
      - first_half
      - pause
      - second_half
    icon: mdi:state-machine

timer:
  water_garden_segment:
    name: Water Garden Segment
    restore: true
    icon: mdi:sprinkler

input_button:
  water_garden_start:
    name: Start Watering
    icon: mdi:sprinkler-variant

template:
  - sensor:
      - name: "Water Butt Litres Left"
        unique_id: water_butt_litres_left
        unit_of_measurement: "L"
        state_class: measurement
        state: >
          {% set dist = states('sensor.ultrasonic_waterbutt') | float(none) %}
          {% set low = states('input_number.water_butt_max_low_level') | float(none) %}
          {% set lpcm = states('input_number.water_butt_litres_per_cm') | float(none) %}
          {% if none in [dist, low, lpcm] %}
            unavailable
          {% else %}
            {{ [[(low - dist) * lpcm, 0] | max, 99999] | min | round(0) }}
          {% endif %}

      - name: "Water Butt Litres Required"
        unique_id: water_butt_litres_required
        unit_of_measurement: "L"
        state_class: measurement
        state: >
          {% set red = states('input_number.water_garden_dripper_red_count') | float(none) %}
          {% set black = states('input_number.water_garden_dripper_black_count') | float(none) %}
          {% set mins = states('input_number.water_garden_duration_minutes') | float(none) %}
          {% if none in [red, black, mins] %}
            unavailable
          {% else %}
            {{ ((red * 2 + black * 4) * mins / 60) | round(0) }}
          {% endif %}

      - name: "Water Garden Flow"
        unique_id: water_garden_flow_lph
        unit_of_measurement: "L/h"
        state_class: measurement
        state: >
          {% set red = states('input_number.water_garden_dripper_red_count') | float(none) %}
          {% set black = states('input_number.water_garden_dripper_black_count') | float(none) %}
          {% if none in [red, black] %}
            unavailable
          {% else %}
            {{ (red * 2 + black * 4) | round(0) }}
          {% endif %}

      - name: "Last litres used (actual)"
        unique_id: water_garden_litres_used_session
        default_entity_id: sensor.water_garden_litres_used_session
        unit_of_measurement: "L"
        state_class: measurement
        icon: mdi:water-minus
        state: >
          {% set start = states('input_number.water_garden_session_start_cm') | float(none) %}
          {% set end = states('sensor.ultrasonic_waterbutt') | float(none) %}
          {% set lpcm = states('input_number.water_butt_litres_per_cm') | float(none) %}
          {% if none in [start, end, lpcm] %}
            unavailable
          {% else %}
            {{ [(end - start) * lpcm, 0] | max | round(0) }}
          {% endif %}

      - name: "Last watering vs required"
        unique_id: water_garden_last_usage_delta
        default_entity_id: sensor.water_garden_last_usage_delta
        unit_of_measurement: "L"
        state_class: measurement
        state: >
          {% set start = states('input_number.water_garden_session_start_cm') | float(none) %}
          {% set end = states('sensor.ultrasonic_waterbutt') | float(none) %}
          {% set lpcm = states('input_number.water_butt_litres_per_cm') | float(none) %}
          {% set need = states('input_number.water_garden_session_expected_litres') | float(none) %}
          {% if none in [start, end, lpcm, need] %}
            unavailable
          {% else %}
            {{ ([(end - start) * lpcm, 0] | max - need) | round(0) }}
          {% endif %}

      - name: "Water Butt Minimum Refill %"
        unique_id: water_butt_minimum_refill_percent
        unit_of_measurement: "%"
        state: >
          {% set high = states('input_number.water_butt_max_high_level') | float(none) %}
          {% set low = states('input_number.water_butt_max_low_level') | float(none) %}
          {% set need = states('sensor.water_butt_litres_required') | float(none) %}
          {% set lpcm = states('input_number.water_butt_litres_per_cm') | float(none) %}
          {% set capacity = (low - high) * lpcm if none not in [high, low, lpcm] else none %}
          {% if none in [need, capacity] or capacity == 0 %}
            unavailable
          {% else %}
            {{ [[(need / capacity * 100), 0] | max, 100] | min | round(0) }}
          {% endif %}

      - name: "Water Butt Level"
        unique_id: water_butt_level_percent
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set distance = states('sensor.ultrasonic_waterbutt') | float(none) %}
          {% set high = states('input_number.water_butt_max_high_level') | float(none) %}
          {% set low = states('input_number.water_butt_max_low_level') | float(none) %}
          {% if distance is none or high is none or low is none or (low - high) == 0 %}
            unavailable
          {% else %}
            {{ [[((low - distance) / (low - high) * 100), 0] | max, 100] | min | round(0) }}
          {% endif %}
        availability: >
          {{ states('sensor.ultrasonic_waterbutt') not in ['unknown', 'unavailable']
             and states('input_number.water_butt_max_high_level') not in ['unknown', 'unavailable']
             and states('input_number.water_butt_max_low_level') not in ['unknown', 'unavailable'] }}

  - switch:
      - name: "Start Watering"
        unique_id: water_garden_watering
        default_entity_id: switch.water_garden_watering
        icon: mdi:sprinkler-variant
        state: "{{ not is_state('input_select.water_garden_phase', 'idle') }}"
        turn_on:
          - action: script.water_garden_start
            data: {}
        turn_off:
          - action: script.water_garden_stop
            data:
              reason: STOP - Start Watering toggled off

  # Watchdog only while fill valve OR pump is on. Idle stable levels often do not
  # refresh HA last_updated, which falsely looked like a dead sensor.
  # Trip condition: unavailable/unknown for N minutes while active (not "unchanged cm").
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.ultrasonic_waterbutt
          - switch.outside_tap_valve
          - switch.study_water_pump
          - input_number.water_butt_distance_stale_minutes
    binary_sensor:
      - name: "Water butt distance stale"
        unique_id: water_butt_distance_stale
        default_entity_id: binary_sensor.water_butt_distance_stale
        device_class: problem
        icon: mdi:radar
        state: >
          {% set active = is_state('switch.outside_tap_valve', 'on')
             or is_state('switch.study_water_pump', 'on') %}
          {% if not active %}
            false
          {% else %}
            {% set mins = states('input_number.water_butt_distance_stale_minutes') | float(15) %}
            {% set s = states.sensor.ultrasonic_waterbutt %}
            {% if s is none %}
              true
            {% elif s.state not in ['unavailable', 'unknown', 'none', ''] %}
              false
            {% else %}
              {{ (as_timestamp(now()) - as_timestamp(s.last_changed)) >= (mins * 60) }}
            {% endif %}
          {% endif %}

script:
  water_butt_distance_fault_trip:
    alias: Water butt distance sensor fault
    description: >-
      Distance sensor unavailable while fill valve or pump is on - abort watering,
      close fill valve, disable Enable top-up, latch fault. Hourly reminders until
      the sensor reports again.
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.water_butt_distance_fault
            state: "on"
        then:
          - stop: ""
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.water_butt_distance_fault
      - action: switch.turn_off
        target:
          entity_id: switch.outside_tap_valve
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.water_butt_topup_phase
                state: idle
        then:
          - action: timer.cancel
            target:
              entity_id: timer.water_butt_topup_segment
          - action: input_select.select_option
            target:
              entity_id: input_select.water_butt_topup_phase
            data:
              option: idle
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: idle
        then:
          - action: timer.cancel
            target:
              entity_id: timer.water_garden_segment
          - action: input_select.select_option
            target:
              entity_id: input_select.water_garden_phase
            data:
              option: idle
          - action: switch.turn_off
            target:
              entity_id: switch.study_water_pump
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_butt_topup_enabled
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            FAULT - water butt distance sensor unavailable for {{
            states('input_number.water_butt_distance_stale_minutes') | float(15) | round(0)
            }} min while fill valve or pump was ON (state {{
            states('sensor.ultrasonic_waterbutt') }}). Filling and watering DISABLED.
            Enable top-up turned OFF. Reminder every hour until the sensor recovers.

  water_garden_start:
    alias: Start Watering
    description: >-
      Start a split watering run - 50% on, pause (butts rebalance), 50% on.
      Duration from input_number.water_garden_duration_minutes. Survives HA restart via
      timer.water_garden_segment (restore) + input_select.water_garden_phase.
      Feedback is via Telegram only (no Home Assistant bell / persistent notifications).
    mode: single
    sequence:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: idle
        then:
          - action: notify.notifier_telegram_leon
            data:
              message: >-
                Water Garden start ignored - already running (phase {{
                states('input_select.water_garden_phase') }}).
          - stop: ""
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: sensor.ultrasonic_waterbutt
                state: unavailable
              - condition: state
                entity_id: sensor.ultrasonic_waterbutt
                state: unknown
              - condition: state
                entity_id: input_boolean.water_butt_distance_fault
                state: "on"
              - condition: state
                entity_id: binary_sensor.water_butt_distance_stale
                state: "on"
        then:
          - action: notify.notifier_telegram_leon
            data:
              message: >-
                Water Garden start blocked - distance sensor unavailable/fault
                ({{ states('sensor.ultrasonic_waterbutt') }}). Fix the sensor first.
          - stop: ""
      - if:
          - condition: numeric_state
            entity_id: sensor.ultrasonic_waterbutt
            above: input_number.water_butt_max_low_level
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.study_water_pump
          - action: notify.notifier_telegram_leon
            data:
              message: >-
                Water Garden start blocked - water too low (level {{
                states('sensor.water_butt_level') }}%, {{
                states('sensor.water_butt_litres_left') }} L left). Pump left OFF.
          - stop: ""
      - action: input_select.select_option
        target:
          entity_id: input_select.water_garden_phase
        data:
          option: first_half
      - action: switch.turn_on
        target:
          entity_id: switch.study_water_pump
      - action: timer.start
        target:
          entity_id: timer.water_garden_segment
        data:
          duration: >
            {% set secs = (states('input_number.water_garden_duration_minutes') | float(60) / 2 * 60) | int %}
            {{ '%02d:%02d:%02d' % (secs // 3600, (secs % 3600) // 60, secs % 60) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.water_garden_session_start_cm
        data:
          value: "{{ states('sensor.ultrasonic_waterbutt') | float(0) | round(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.water_garden_session_expected_litres
        data:
          value: "{{ states('sensor.water_butt_litres_required') | float(0) | round(0) }}"
      # Fill-session calibration tiles reset when watering starts (display only).
      - action: script.water_butt_fill_session_reset
        data: {}
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            Water Garden START (first 50%). Duration total {{
            states('input_number.water_garden_duration_minutes') }} min ({{
            (states('input_number.water_garden_duration_minutes') | float(60) / 2) | round(1)
            }} min this half). Level {{ states('sensor.water_butt_level') }}%, litres left {{
            states('sensor.water_butt_litres_left') }} L.

  water_garden_stop:
    alias: Water Garden - Stop
    description: >-
      Abort or finish-cleanup - cancel segment timer, set phase idle, ensure pump off,
      one Telegram message. Optional field "reason" for the notify text.
      Actual litres used stays on the dashboard (live sensor) so butts can equalise first.
      No-op if already idle (avoids duplicate Telegram from toggle sync).
    mode: single
    fields:
      reason:
        name: Reason
        description: Shown in the Telegram message
        default: STOP / abort
        selector:
          text:
    sequence:
      - if:
          - condition: state
            entity_id: input_select.water_garden_phase
            state: idle
        then:
          - stop: ""
      - action: timer.cancel
        target:
          entity_id: timer.water_garden_segment
      - action: input_select.select_option
        target:
          entity_id: input_select.water_garden_phase
        data:
          option: idle
      - action: switch.turn_off
        target:
          entity_id: switch.study_water_pump
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            Water Garden {{ reason | default('STOP / abort') }}. Level {{
            states('sensor.water_butt_level') }}%, litres left {{
            states('sensor.water_butt_litres_left') }} L.

automation:
  - id: "1784746590314"
    alias: Water Garden Start
    description: >-
      Legacy input_button Start Watering: idle -> start, otherwise stop (toggle).
      Prefer switch.water_garden_watering on the dashboard. Pump toggle alone does
      not start the sequence.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.water_garden_start
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: idle
            sequence:
              - action: script.water_garden_start
                data: {}
        default:
          - action: script.water_garden_stop
            data:
              reason: STOP - Start Watering pressed again

  - id: "1784825343018"
    alias: Water Garden - Stop
    description: >-
      Manual pump OFF during an active watering half aborts the run. Ignores switch-off
      during pause / idle so end-of-half transitions do not double-fire.
    mode: single
    triggers:
      - trigger: switch.turned_off
        target:
          entity_id: switch.study_water_pump
        options:
          behavior: each
          for: 00:00:00
    conditions:
      - condition: state
        entity_id: input_select.water_garden_phase
        state:
          - first_half
          - second_half
    actions:
      - action: script.water_garden_stop
        data: {}

  - id: "1784745405904"
    alias: Water Garden - Pump is on but Water is too low
    description: >-
      Distance above Max Low during a watering half -> abort via stop script.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ultrasonic_waterbutt
        above: input_number.water_butt_max_low_level
    conditions:
      - condition: state
        entity_id: input_select.water_garden_phase
        state:
          - first_half
          - second_half
    actions:
      - action: script.water_garden_stop
        data:
          reason: STOP - water too low

  - id: "1784803698288"
    alias: Water Garden - Water butt is full
    description: Notify when full or enough for tomorrow, with 2 min debounce.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ultrasonic_waterbutt
        below: input_number.water_butt_max_high_level
        for: "00:02:00"
        id: full
      - trigger: numeric_state
        entity_id: sensor.water_butt_litres_left
        above: sensor.water_butt_litres_required
        for: "00:02:00"
        id: enough
    conditions: []
    actions:
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            {% set left = states('sensor.water_butt_litres_left') %}
            {% if trigger.id == 'full' %}
            Water butt is full ({{ left }} L left; level {{ states('sensor.water_butt_level') }}%)
            {% else %}
            Water butt has enough for next watering ({{ left }} L left; need {{
            states('sensor.water_butt_litres_required') }} L for current Duration)
            {% endif %}

  - id: water_garden_segment_finished
    alias: Water Garden - Segment finished
    description: >-
      Advances split-run state machine when timer.water_garden_segment finishes.
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.water_garden_segment
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: first_half
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.water_garden_phase
                data:
                  option: pause
              - action: switch.turn_off
                target:
                  entity_id: switch.study_water_pump
              - action: notify.notifier_telegram_leon
                data:
                  message: >-
                    Water Garden first 50% DONE. Level {{
                    states('sensor.water_butt_level') }}%, litres left {{
                    states('sensor.water_butt_litres_left') }} L. Pausing {{
                    states('input_number.water_garden_pause_minutes')
                    }} min for butts to rebalance.
              - action: timer.start
                target:
                  entity_id: timer.water_garden_segment
                data:
                  duration: >
                    {% set secs = (states('input_number.water_garden_pause_minutes') | float(15) * 60) | int %}
                    {{ '%02d:%02d:%02d' % (secs // 3600, (secs % 3600) // 60, secs % 60) }}
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: pause
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.water_garden_phase
                data:
                  option: second_half
              - action: switch.turn_on
                target:
                  entity_id: switch.study_water_pump
              - action: timer.start
                target:
                  entity_id: timer.water_garden_segment
                data:
                  duration: >
                    {% set secs = (states('input_number.water_garden_duration_minutes') | float(60) / 2 * 60) | int %}
                    {{ '%02d:%02d:%02d' % (secs // 3600, (secs % 3600) // 60, secs % 60) }}
              - action: notify.notifier_telegram_leon
                data:
                  message: >-
                    Water Garden second 50% START. Level {{
                    states('sensor.water_butt_level') }}%, litres left {{
                    states('sensor.water_butt_litres_left') }} L.
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: second_half
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.water_garden_phase
                data:
                  option: idle
              - action: switch.turn_off
                target:
                  entity_id: switch.study_water_pump
              - action: notify.notifier_telegram_leon
                data:
                  message: >-
                    Water Garden second 50% DONE (run complete). Level {{
                    states('sensor.water_butt_level') }}%, litres left {{
                    states('sensor.water_butt_litres_left') }} L.
        default:
          - action: notify.notifier_telegram_leon
            data:
              message: >-
                Water Garden timer finished but phase was '{{
                states('input_select.water_garden_phase') }}' (expected first_half,
                pause, or second_half). Check phase / pump manually.

  - id: water_garden_ha_start_recover
    alias: Water Garden - Recover after HA restart
    description: >-
      After HA starts, re-sync pump with phase. Timer restore handles remaining duration.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.water_garden_phase
            state: idle
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state:
                  - first_half
                  - second_half
              - condition: state
                entity_id: switch.study_water_pump
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.study_water_pump
              - action: notify.notifier_telegram_leon
                data:
                  message: >-
                    HA restarted mid Water Garden run (phase {{
                    states('input_select.water_garden_phase') }}). Pump turned back ON.
                    Timer should still be running.
          - conditions:
              - condition: state
                entity_id: input_select.water_garden_phase
                state: pause
              - condition: state
                entity_id: switch.study_water_pump
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.study_water_pump
              - action: notify.notifier_telegram_leon
                data:
                  message: >-
                    HA restarted during Water Garden pause. Pump turned OFF. Pause
                    timer should still be running.

  - id: water_butt_distance_stale_seed
    alias: Water butt distance - Seed stale minutes if unset
    description: Default Distance sensor stale after = 15 min when helper is unset.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - if:
          - condition: template
            value_template: >
              {{ states('input_number.water_butt_distance_stale_minutes') in
              ['unknown', 'unavailable', 'none', '']
              or states('input_number.water_butt_distance_stale_minutes') | float(0) == 0 }}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.water_butt_distance_stale_minutes
            data:
              value: 15

  - id: water_butt_distance_stale_trip
    alias: Water butt distance - Unavailable while active trip
    description: >-
      While fill valve or pump is ON, if the ultrasonic stays unavailable for the
      helper timeout, abort watering and filling. Idle stable levels are ignored.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_butt_distance_stale
        to: "on"
    conditions: []
    actions:
      - action: script.water_butt_distance_fault_trip
        data: {}

  - id: water_butt_distance_stale_hourly
    alias: Water butt distance - Hourly fault reminder
    description: Telegram every hour while a distance-sensor fault is latched.
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.water_butt_distance_fault
        state: "on"
    actions:
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            REMINDER - water butt distance sensor fault still active (state {{
            states('sensor.ultrasonic_waterbutt') }}, timeout {{
            states('input_number.water_butt_distance_stale_minutes') | float(15) | round(0)
            }} min). Filling and watering remain DISABLED until the sensor recovers.
            Re-enable top-up manually after it is healthy.

  - id: water_butt_distance_stale_recovered
    alias: Water butt distance - Recovered
    description: Clear latched fault when the ultrasonic reports a numeric reading again.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.ultrasonic_waterbutt
    conditions:
      - condition: state
        entity_id: input_boolean.water_butt_distance_fault
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.ultrasonic_waterbutt') not in
             ['unavailable', 'unknown', 'none', '']
             and states('sensor.ultrasonic_waterbutt') | float(none) is not none }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_butt_distance_fault
      - action: notify.notifier_telegram_leon
        data:
          message: >-
            Water butt distance sensor RECOVERED ({{
            states('sensor.ultrasonic_waterbutt') }} cm). Watering is allowed again.
            Enable top-up stays OFF until you turn it back on.
