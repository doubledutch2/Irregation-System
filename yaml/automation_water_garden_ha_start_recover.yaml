- id: water_garden_ha_start_recover
  alias: Water Garden - Recover after HA restart
  description: >-
    After HA starts, if a watering half is in progress but the pump is off, turn it
    back on. If phase is pause but the pump is on, turn it off. Timer restore handles
    remaining duration separately (timer.water_garden_segment restore: true).
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.water_garden_phase
          state: idle
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.water_garden_phase
              state:
                - first_half
                - second_half
            - condition: state
              entity_id: switch.study_water_pump
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.study_water_pump
            - action: notify.notifier_telegram_leon
              data:
                message: >-
                  HA restarted mid Water Garden run (phase {{
                  states('input_select.water_garden_phase') }}). Pump turned back ON.
                  Timer should still be running.
        - conditions:
            - condition: state
              entity_id: input_select.water_garden_phase
              state: pause
            - condition: state
              entity_id: switch.study_water_pump
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.study_water_pump
            - action: notify.notifier_telegram_leon
              data:
                message: >-
                  HA restarted during Water Garden pause. Pump turned OFF. Pause
                  timer should still be running.
