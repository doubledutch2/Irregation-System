- id: '1784746590314'
  alias: Water Garden Start
  description: >-
    Legacy input_button Start Watering: idle -> start, otherwise stop (toggle).
    Prefer switch.water_garden_watering on the dashboard.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_button.water_garden_start
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.water_garden_phase
              state: idle
          sequence:
            - action: script.water_garden_start
              data: {}
      default:
        - action: script.water_garden_stop
          data:
            reason: STOP - Start Watering pressed again
