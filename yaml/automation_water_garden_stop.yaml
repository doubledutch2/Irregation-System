- id: '1784825343018'
  alias: Water Garden - Stop
  description: >-
    REPLACE existing automation. Manual pump OFF during an active watering half
    aborts the run (cancel timer, phase idle, one notify via stop script).
    Ignores switch-off during pause / idle so end-of-half transitions do not double-fire.
  mode: single
  triggers:
    - trigger: switch.turned_off
      target:
        entity_id: switch.study_water_pump
      options:
        behavior: each
        for: 00:00:00
  conditions:
    - condition: state
      entity_id: input_select.water_garden_phase
      state:
        - first_half
        - second_half
  actions:
    - action: script.water_garden_stop
      data: {}
